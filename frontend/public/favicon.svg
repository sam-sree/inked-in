<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="pen" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Ink stroke / pen body -->
  <g filter="url(#glow)">
    <!-- Pen tip and body -->
    <path d="M42 12 L52 22 L22 52 L12 52 L12 42 Z" fill="url(#pen)" opacity="0.9"/>
    <!-- Pen tip highlight -->
    <path d="M42 12 L52 22 L46 22 L42 18 Z" fill="#e0e7ff" opacity="0.5"/>
    <!-- Nib -->
    <path d="M12 42 L22 52 L12 52 Z" fill="#c084fc" opacity="0.8"/>
    <!-- Ink line stroke -->
    <path d="M14 50 L50 14" stroke="#e0e7ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Cute ink drop -->
  <circle cx="48" cy="48" r="5" fill="#6366f1" opacity="0.85" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="2.5" fill="#a5b4fc" opacity="0.6"/>

  <!-- Small sparkle dots -->
  <circle cx="20" cy="16" r="1.5" fill="#818cf8" opacity="0.6"/>
  <circle cx="16" cy="22" r="1" fill="#c084fc" opacity="0.5"/>
</svg>